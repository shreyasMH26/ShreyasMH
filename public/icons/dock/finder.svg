<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="finderBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B92F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#finderBg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Finder Face Left -->
  <path d="M 28 32 C 28 26 34 22 42 22 L 64 22 L 64 106 L 42 106 C 34 106 28 102 28 96 Z" fill="url(#faceLeft)"/>
  <!-- Finder Face Right -->
  <path d="M 64 22 L 86 22 C 94 22 100 26 100 32 L 100 96 C 100 102 94 106 86 106 L 64 106 Z" fill="url(#faceRight)"/>
  <!-- Blue central curved divider -->
  <path d="M 64 22 Q 62 60 70 70 Q 75 78 64 88 L 64 106" fill="none" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="48" cy="52" r="5" fill="#0F172A"/>
  <circle cx="80" cy="52" r="5" fill="#0F172A"/>
  <circle cx="49" cy="50.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="81" cy="50.5" r="1.5" fill="#FFFFFF"/>
  <!-- Smile -->
