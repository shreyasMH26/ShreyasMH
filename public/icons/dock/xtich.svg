<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="xtichBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A141A"/>
      <stop offset="50%" stop-color="#051A24"/>
      <stop offset="100%" stop-color="#02080D"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F3E8C8"/>
      <stop offset="100%" stop-color="#C5A880"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#xtichBg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  
  <!-- Outer luxury stitch pattern border -->
  <rect x="15" y="15" width="98" height="98" rx="20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Monogram / Typography: XTICH -->
  <text x="64" y="68" 
    text-anchor="middle" 
    dominant-baseline="central"
    fill="url(#goldSheen)" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="21" 
    font-weight="800" 
    letter-spacing="3.5">XTICH</text>
  
  <text x="64" y="88" 
    text-anchor="middle" 
    dominant-baseline="central"
    fill="#8EA3AD" 
    font-family="system-ui, -apple-system, sans-serif" 
    font-size="8" 
    font-weight="600" 
    letter-spacing="2.5">STUDIO</text>
</svg>
