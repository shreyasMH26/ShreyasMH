<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mailBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#mailBg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Crisp Envelope -->
  <rect x="22" y="36" width="84" height="56" rx="8" fill="url(#envGrad)"/>
  <path d="M 22 42 L 64 68 L 106 42" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 22 90 L 52 64" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 106 90 L 76 64" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Unread indicator dot badge -->
  <circle cx="102" cy="26" r="8" fill="#EF4444"/>
  <circle cx="102" cy="26" r="3" fill="#FFFFFF"/>
</svg>
