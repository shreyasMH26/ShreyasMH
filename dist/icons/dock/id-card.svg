<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="dock-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f232b"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>
    <linearGradient id="card-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf7f1"/>
      <stop offset="100%" stop-color="#eae4d5"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#2f4488"/>
    </linearGradient>
  </defs>
  <!-- Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#dock-bg)" filter="url(#card-shadow)"/>
  
  <!-- Lanyard clip & loop at top -->
  <g transform="translate(64, 25)">
    <path d="M-10,-14 C-10,-18 -4,-21 0,-21 C4,-21 10,-18 10,-14 L6,-6 L-6,-6 Z" fill="#353b47" opacity="0.8"/>
    <rect x="-8" y="-7" width="16" height="8" rx="2" fill="#c4c8d0"/>
    <rect x="-4" y="1" width="8" height="6" rx="1.5" fill="#8e94a0"/>
  </g>

  <!-- ID Card itself -->
  <g transform="translate(34, 30)">
    <rect x="0" y="0" width="60" height="78" rx="7" fill="url(#card-body)" filter="url(#card-shadow)"/>
    <rect x="23" y="4" width="14" height="3" rx="1.5" fill="#15171d" opacity="0.75"/>
    <path d="M8,13 L12,20 L4,20 Z" fill="url(#accent-grad)"/>
    <rect x="15" y="14" width="22" height="2.5" rx="1" fill="#15171d"/>
    <rect x="15" y="18" width="14" height="1.8" rx="0.9" fill="#717684"/>
    <rect x="8" y="24" width="44" height="26" rx="4" fill="#1c2029"/>
    <circle cx="24" cy="35" r="5" fill="#5b8cff"/>
    <path d="M16,47 C16,41 21,39 24,39 C27,39 32,41 32,47 Z" fill="#3f5fd8"/>
    <circle cx="44" cy="43" r="3.5" fill="url(#accent-grad)"/>
    <path d="M42.5,43 L43.5,44 L45.5,42" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round"/>
    <rect x="8" y="54" width="28" height="3" rx="1" fill="#15171d"/>
    <rect x="8" y="59" width="38" height="2" rx="0.8" fill="#717684"/>
    <g transform="translate(8, 65)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#15171d" stroke-width="1.2"/>
      <line x1="3" y1="0" x2="3" y2="5" stroke="#15171d" stroke-width="0.8"/>
      <line x1="6" y1="0" x2="6" y2="5" stroke="#15171d" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="10" y2="5" stroke="#15171d" stroke-width="0.8"/>
      <line x1="13" y1="0" x2="13" y2="5" stroke="#15171d" stroke-width="1.2"/>
      <line x1="16" y1="0" x2="16" y2="5" stroke="#15171d" stroke-width="1"/>
      <line x1="20" y1="0" x2="20" y2="5" stroke="#15171d" stroke-width="1.5"/>
      <line x1="24" y1="0" x2="24" y2="5" stroke="#15171d" stroke-width="0.8"/>
    </g>
    <rect x="38" y="64" width="14" height="8" rx="1" fill="#15171d" opacity="0.8"/>
  </g>

  <!-- Rim Border -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
</svg>
