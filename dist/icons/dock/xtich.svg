<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircle">
      <rect x="8" y="8" width="112" height="112" rx="26"/>
    </clipPath>
  </defs>
  <!-- macOS Squircle White Base with Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Clipped XTICH Studios Logo -->
  <g clip-path="url(#squircle)">
    <image href="data:image/png;base64," x="8" y="8" width="112" height="112" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <!-- Subtle Inset Highlight / Rim Border -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.2"/>
</svg>